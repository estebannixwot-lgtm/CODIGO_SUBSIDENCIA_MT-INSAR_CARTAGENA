######################################################
# smallbaselineApp.cfg
# Configuracion MintPy para Tesis InSAR
# Perez Munoz & Pinto Casique - UDFJC 2026
#
# NOTA: El punto de referencia (reference.lalo) se
# configura automaticamente desde el pipeline Python.
# Ejecute: smallbaselineApp.py smallbaselineApp.cfg
######################################################

##————————————————————————————————————————————
## CARGA DE DATOS (SNAP -> MintPy)
##————————————————————————————————————————————
mintpy.load.processor       = snap
mintpy.load.unwFile         = ../06_MINTPY_INPUTS/*/*_unw_tc.dim
mintpy.load.corFile         = ../06_MINTPY_INPUTS/*/*_coh_tc.dim
mintpy.load.connCompFile    = auto

##————————————————————————————————————————————
## PUNTO DE REFERENCIA ESPACIAL
##————————————————————————————————————————————
# lat:lon del punto donde velocidad = 0 mm/a
# Este valor se actualiza desde el Paso 10 del pipeline
mintpy.reference.lalo       = :

##————————————————————————————————————————————
## RED DE INTERFEROGRAMAS (SBAS)
##————————————————————————————————————————————
mintpy.network.coherenceBased  = yes
mintpy.network.minCoherence    = 0.6

##————————————————————————————————————————————
## MASCARA DE COHERENCIA ESPACIAL
##————————————————————————————————————————————
mintpy.velocity.maskFile       = avgSpatialCoh.h5
mintpy.velocity.maskDataset    = avgSpatialCoh
mintpy.velocity.maskThreshold  = 0.6

##————————————————————————————————————————————
## CORRECCION ATMOSFERICA (ERA5 via PyAPS)
##————————————————————————————————————————————
# Usa datos de reanálisis ERA5 del ECMWF para remover
# retardos troposféricos de cada interferograma.
# REQUISITO: Cuenta gratuita en https://cds.climate.copernicus.eu
# y archivo ~/.cdsapirc configurado con su API key.
mintpy.troposphericDelay.method        = pyaps
mintpy.troposphericDelay.weatherModel  = ERA5
mintpy.troposphericDelay.weatherDir    = ./ERA5

##————————————————————————————————————————————
## INVERSION DE SERIE TEMPORAL
##————————————————————————————————————————————
mintpy.networkInversion.weightFunc = var
mintpy.networkInversion.minTempCoh = 0.5

##————————————————————————————————————————————
## SALIDA
##————————————————————————————————————————————
mintpy.save.hdfEos5         = no
mintpy.save.kmz             = no
mintpy.plot                 = yes
