<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline InSAR - UDFJC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div>
    <h1>Pipeline InSAR Automatizado</h1>
    <span class="subtitle">Perez Munoz &amp; Pinto Casique &mdash; Tesis ICG UDFJC 2026</span>
  </div>
  <div class="status-badges">
    <div class="badge"><span class="dot" id="dot-gpt"></span><span id="lbl-gpt">GPT</span></div>
    <div class="badge"><span class="dot" id="dot-snaphu"></span><span id="lbl-snaphu">SNAPHU</span></div>
  </div>
</header>

<div class="flow-diagram" id="flowDiagram"></div>

<div class="scan-summary" id="scanSummary"></div>

<div class="container">
  <div class="steps-panel" id="stepsPanel"></div>
  <div class="log-panel">
    <div class="log-header">
      <h3>Consola en Tiempo Real</h3>
      <button class="btn" onclick="clearLogs()" style="padding:0.3rem 0.7rem;font-size:0.7rem;background:var(--bg-input);color:var(--text-muted);">Limpiar</button>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
    <div class="log-body" id="logBody">
      <div class="log-line info">Esperando inicio de proceso...</div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
